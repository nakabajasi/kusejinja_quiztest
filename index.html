<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#eaf5e8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>デジタルスタンプ大作戦!芝ヶ原古墳古墳群（久世神社・久世廃寺跡）</title>
  <style>
    :root {
      --forest: #35634c;
      --ink: #314536;
      --green: #eaf5e8;
      --yellow: #fff5d6;
      --pink: #fdebf0;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
      color: var(--ink);
      background: #f2f8ee;
    }

    button, input { font: inherit; }
    button { cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    button:focus-visible, input:focus-visible { outline: 3px solid #ed9ebb; outline-offset: 3px; }
    [hidden] { display: none !important; }

    #home {
      min-height: 100svh;
      padding: max(18px, var(--safe-top)) max(14px, var(--safe-right))
               max(28px, var(--safe-bottom)) max(14px, var(--safe-left));
      background:
        radial-gradient(ellipse at 6% 24%, rgba(245, 207, 218, .36), transparent 43%),
        radial-gradient(ellipse at 94% 53%, rgba(255, 236, 153, .42), transparent 48%),
        linear-gradient(160deg, #e8f5e9 0%, #f8faeb 54%, #fceef2 100%);
    }

    .page {
      width: min(100%, 900px);
      margin: 0 auto;
    }

    .mission-statement {
      margin: 8px 0 22px;
      color: #305b43;
      font-size: clamp(19px, 4.9vw, 26px);
      font-weight: 750;
      line-height: 1.7;
    }

    .mission-label {
      font-weight: 850;
    }

    .mission-hint {
      margin: 0 0 13px;
      color: #516a48;
      font-size: clamp(15px, 4vw, 19px);
      font-weight: 650;
      line-height: 1.7;
    }

    .mission-hint:last-of-type {
      color: #805e69;
    }

    .camera-launch {
      display: block;
      width: 100%;
      border: 2px solid #b9d6b7;
      border-radius: 18px;
      background: #fff;
      padding: 0;
      margin: 21px auto 0;
      overflow: hidden;
      box-shadow: 0 7px 22px rgba(63, 102, 72, .12);
    }

    .camera-launch:active { transform: scale(.992); }
    .camera-launch img { display: block; width: 100%; height: auto; }

    #startError {
      margin: 12px 2px 0;
      color: #a0313c;
      font-size: 14px;
      line-height: 1.6;
      text-align: center;
      font-weight: 700;
    }

    body.camera-open { overflow: hidden; }

    #cameraStage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #000;
      color: #fff;
      z-index: 100;
      user-select: none;
      -webkit-user-select: none;
      overscroll-behavior: none;
      touch-action: manipulation;
    }

    #camera {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }

    #overlayWrap {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: 8;
      pointer-events: none;
    }

    #overlay {
      position: absolute;
      display: block;
      opacity: 1;
      pointer-events: none;
      -webkit-user-drag: none;
      user-select: none;
    }

    #backHome {
      position: absolute;
      top: calc(var(--safe-top) + 12px);
      left: calc(var(--safe-left) + 12px);
      z-index: 20;
      min-height: 40px;
      padding: 8px 13px;
      border: 1px solid rgba(255,255,255,.26);
      border-radius: 12px;
      background: rgba(0,0,0,.56);
      color: #fff;
      font-size: 13px;
      font-weight: 750;
    }

    #controls {
      position: absolute;
      left: calc(var(--safe-left) + 12px);
      right: calc(var(--safe-right) + 12px);
      bottom: calc(var(--safe-bottom) + 96px);
      z-index: 20;
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 16px;
      background: rgba(0,0,0,.65);
      padding: 12px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .controls-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 32px;
      margin-bottom: 6px;
    }

    .controls-title { font-size: 14px; font-weight: 800; }

    #toggleControls {
      width: 34px;
      height: 34px;
      padding: 0;
      border: 1px solid rgba(255,255,255,.26);
      border-radius: 9px;
      background: rgba(255,255,255,.12);
      color: #fff;
      font-size: 20px;
      font-weight: 800;
    }

    #controls.minimized {
      left: auto;
      right: calc(var(--safe-right) + 12px);
      bottom: calc(var(--safe-bottom) + 12px);
      width: auto;
      padding: 8px;
    }

    #controls.minimized .controls-header { margin: 0; }
    #controls.minimized .scale-row, #controls.minimized .controls-title { display: none; }

    .scale-row {
      display: grid;
      grid-template-columns: 28px 1fr 44px;
      align-items: center;
      gap: 8px;
      min-height: 40px;
    }

    .scale-row label { font-size: 13px; font-weight: 700; }
    #scale { width: 100%; accent-color: #acd7ac; }
    #scaleValue { text-align: right; font-size: 13px; font-variant-numeric: tabular-nums; }

    #bottomBar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: calc(var(--safe-bottom) + 12px);
      z-index: 25;
      display: flex;
      justify-content: center;
      pointer-events: none;
    }

    #shutter {
      pointer-events: auto;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 5px solid rgba(255,255,255,.48);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(0,0,0,.32) inset;
    }

    #shutter:active { transform: scale(.94); }

    #flash {
      position: absolute;
      inset: 0;
      z-index: 70;
      background: #fff;
      pointer-events: none;
      opacity: 0;
    }

    #flash.on { animation: flash .18s ease-out; }
    @keyframes flash { 0% { opacity: .9; } 100% { opacity: 0; } }

    #captureView {
      position: absolute;
      inset: 0;
      z-index: 80;
      background: #000;
    }

    #capturedImage {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      user-select: auto;
      -webkit-user-select: auto;
      -webkit-touch-callout: default;
      -webkit-user-drag: auto;
    }

    #captureHint {
      position: absolute;
      top: calc(var(--safe-top) + 12px);
      left: 50%;
      transform: translateX(-50%);
      width: max-content;
      max-width: calc(100% - 24px);
      padding: 10px 15px;
      border-radius: 16px;
      background: rgba(0,0,0,.68);
      color: #fff;
      text-align: center;
      font-size: clamp(12px, 3.3vw, 15px);
      font-weight: 700;
      line-height: 1.55;
      pointer-events: none;
    }

    #captureActions {
      position: absolute;
      left: calc(var(--safe-left) + 12px);
      right: calc(var(--safe-right) + 12px);
      bottom: calc(var(--safe-bottom) + 12px);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    #captureActions button {
      min-height: 52px;
      border: 1px solid rgba(255,255,255,.30);
      border-radius: 14px;
      background: rgba(0,0,0,.76);
      color: #fff;
      font-weight: 800;
      font-size: 15px;
    }

    #captureActions #shareCapture { background: #dcefdc; color: #254c37; border-color: #dcefdc; }

    @media (orientation: landscape) {
      #controls { bottom: calc(var(--safe-bottom) + 84px); }
      #shutter { width: 62px; height: 62px; }
    }

  </style>
</head>
<body>
  <main id="home">
    <div class="page">
      <p class="mission-statement"><span class="mission-label">ミッション：</span>「誕生釈迦立像」（たんじょうしゃかぶつりゅうぞう）が見つかった場所に行き、西を向いてシャカちゃんと写真を撮ろう！</p>
      <p class="mission-hint">ヒント①久世神社本殿前にある説明板をよく読んでみよう！</p>
      <p class="mission-hint">ヒント②出土位置から西を向くと「踏切」が見える！</p>

      <button id="startCamera" class="camera-launch" type="button" aria-label="カメラを起動">
        <img src="image_camera.png" alt="タップしてカメラを起動" draggable="false">
      </button>
      <div id="startError" role="alert" aria-live="polite"></div>
    </div>
  </main>

  <section id="cameraStage" hidden aria-label="シャカちゃんと記念撮影">
    <video id="camera" autoplay playsinline muted></video>
    <div id="overlayWrap" aria-hidden="true"><img id="overlay" src="image_chara.png" alt="" draggable="false"></div>

    <button id="backHome" type="button">← 戻る</button>

    <div id="controls" aria-label="シャカちゃんの大きさ調整">
      <div class="controls-header">
        <div class="controls-title">シャカちゃんの大きさ調整</div>
        <button id="toggleControls" type="button" aria-expanded="true" aria-controls="scaleRow" aria-label="調整パネルを閉じる">−</button>
      </div>
      <div class="scale-row" id="scaleRow">
        <label for="scale">小</label>
        <input id="scale" type="range" min="0" max="100" value="100" aria-label="キャラクターの大きさ">
        <output id="scaleValue" for="scale">100</output>
      </div>
    </div>

    <div id="bottomBar"><button id="shutter" type="button" aria-label="撮影する"></button></div>
    <div id="flash"></div>

    <section id="captureView" hidden aria-label="撮影結果">
      <img id="capturedImage" alt="シャカちゃんと一緒に撮影した写真">
      <div id="captureHint">※シャカちゃんと写真撮影しました。<br>「写真に保存」をタップして<br>スマートフォンに保存してください。</div>
      <div id="captureActions">
        <button id="closeCapture" type="button">撮り直す</button>
        <button id="shareCapture" type="button">写真に保存</button>
      </div>
    </section>
  </section>

  <canvas id="canvas" hidden></canvas>

  <script>
    'use strict';

    const home = document.getElementById('home');
    const cameraStage = document.getElementById('cameraStage');
    const video = document.getElementById('camera');
    const overlay = document.getElementById('overlay');
    const startCameraBtn = document.getElementById('startCamera');
    const errorEl = document.getElementById('startError');
    const shutter = document.getElementById('shutter');
    const flash = document.getElementById('flash');
    const canvas = document.getElementById('canvas');
    const captureView = document.getElementById('captureView');
    const capturedImage = document.getElementById('capturedImage');
    const closeCapture = document.getElementById('closeCapture');
    const shareCapture = document.getElementById('shareCapture');
    const captureHint = document.getElementById('captureHint');
    const scaleInput = document.getElementById('scale');
    const scaleValue = document.getElementById('scaleValue');
    const controls = document.getElementById('controls');
    const toggleControls = document.getElementById('toggleControls');
    const backHome = document.getElementById('backHome');

    let stream = null;
    let capturedUrl = null;
    let capturedBlob = null;
    let pinchState = null;

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function normalizedToScale(value) {
      return 0.5 + (Number(value) / 100) * 0.5;
    }

    function scaleToNormalized(scale) {
      return Math.round((clamp(scale, 0.5, 1.0) - 0.5) / 0.5 * 100);
    }

    function getOverlayRect(width, height) {
      const imgW = overlay.naturalWidth || 1;
      const imgH = overlay.naturalHeight || 1;
      const fit = Math.min(width / imgW, height / imgH);
      const scale = normalizedToScale(scaleInput.value);
      const drawW = imgW * fit * scale;
      const drawH = imgH * fit * scale;
      return {
        x: (width - drawW) / 2,
        y: (height - drawH) / 2,
        drawW,
        drawH
      };
    }

    function updateOverlay() {
      const rect = cameraStage.getBoundingClientRect();
      if (!rect.width || !rect.height) return;
      const o = getOverlayRect(rect.width, rect.height);
      overlay.style.left = `${o.x}px`;
      overlay.style.top = `${o.y}px`;
      overlay.style.width = `${o.drawW}px`;
      overlay.style.height = `${o.drawH}px`;
      scaleValue.textContent = scaleInput.value;
    }

    scaleInput.addEventListener('input', updateOverlay);
    overlay.addEventListener('load', updateOverlay);
    window.addEventListener('resize', updateOverlay);
    if (window.ResizeObserver) new ResizeObserver(updateOverlay).observe(cameraStage);

    toggleControls.addEventListener('click', () => {
      const minimized = controls.classList.toggle('minimized');
      toggleControls.textContent = minimized ? '+' : '−';
      toggleControls.setAttribute('aria-expanded', String(!minimized));
      toggleControls.setAttribute('aria-label', minimized ? '調整パネルを開く' : '調整パネルを閉じる');
    });

    function getTouchDistance(a, b) {
      return Math.hypot(b.clientX - a.clientX, b.clientY - a.clientY);
    }

    cameraStage.addEventListener('touchstart', event => {
      if (event.touches.length !== 2 || !captureView.hidden || event.target.closest('button, #controls')) return;
      pinchState = {
        startDistance: getTouchDistance(event.touches[0], event.touches[1]),
        startScale: normalizedToScale(scaleInput.value)
      };
      event.preventDefault();
    }, { passive: false });

    cameraStage.addEventListener('touchmove', event => {
      if (!pinchState || event.touches.length !== 2) return;
      const distance = getTouchDistance(event.touches[0], event.touches[1]);
      if (!distance || !pinchState.startDistance) return;
      const scale = clamp(pinchState.startScale * distance / pinchState.startDistance, 0.5, 1.0);
      scaleInput.value = String(scaleToNormalized(scale));
      updateOverlay();
      event.preventDefault();
    }, { passive: false });

    const endPinch = event => {
      if (!event.touches || event.touches.length < 2) pinchState = null;
    };
    cameraStage.addEventListener('touchend', endPinch, { passive: true });
    cameraStage.addEventListener('touchcancel', endPinch, { passive: true });

    ['gesturestart', 'gesturechange', 'gestureend'].forEach(type => {
      cameraStage.addEventListener(type, event => event.preventDefault(), { passive: false });
    });

    function stopCamera() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }
      video.srcObject = null;
    }

    async function startCamera() {
      errorEl.textContent = '';
      if (!overlay.complete || !overlay.naturalWidth) {
        errorEl.textContent = 'image_chara.png を読み込めません。HTMLと同じフォルダに画像があるか確認してください。';
        return;
      }
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        errorEl.textContent = 'このブラウザはカメラ機能に対応していません。Safari / Chromeの最新版で、GitHub Pages（HTTPS）から開いてください。';
        return;
      }

      startCameraBtn.disabled = true;
      stopCamera();
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          }
        });
        video.srcObject = stream;
        await video.play();
        cameraStage.hidden = false;
        document.body.classList.add('camera-open');
        updateOverlay();
      } catch (error) {
        console.error(error);
        stopCamera();
        errorEl.textContent = 'カメラを起動できません。カメラの使用許可と、GitHub Pages（HTTPS）で開いていることを確認してください。';
      } finally {
        startCameraBtn.disabled = false;
      }
    }

    startCameraBtn.addEventListener('click', startCamera);

    backHome.addEventListener('click', () => {
      stopCamera();
      cameraStage.hidden = true;
      captureView.hidden = true;
      document.body.classList.remove('camera-open');
    });

    function drawVideoCover(ctx, targetW, targetH) {
      const vw = video.videoWidth;
      const vh = video.videoHeight;
      if (!vw || !vh) return false;
      const srcRatio = vw / vh;
      const dstRatio = targetW / targetH;
      let sx = 0, sy = 0, sw = vw, sh = vh;
      if (srcRatio > dstRatio) {
        sw = vh * dstRatio;
        sx = (vw - sw) / 2;
      } else {
        sh = vw / dstRatio;
        sy = (vh - sh) / 2;
      }
      ctx.drawImage(video, sx, sy, sw, sh, 0, 0, targetW, targetH);
      return true;
    }

    function flashScreen() {
      flash.classList.remove('on');
      void flash.offsetWidth;
      flash.classList.add('on');
    }

    shutter.addEventListener('click', () => {
      if (!stream || !video.videoWidth || !overlay.naturalWidth || !captureView.hidden) return;

      const rect = cameraStage.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
      const width = Math.max(1, Math.round(rect.width * dpr));
      const height = Math.max(1, Math.round(rect.height * dpr));
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, width, height);
      if (!drawVideoCover(ctx, width, height)) return;

      const o = getOverlayRect(width, height);
      ctx.drawImage(overlay, o.x, o.y, o.drawW, o.drawH);
      flashScreen();
      shutter.disabled = true;

      canvas.toBlob(blob => {
        shutter.disabled = false;
        if (!blob) return;
        capturedBlob = blob;
        if (capturedUrl) URL.revokeObjectURL(capturedUrl);
        capturedUrl = URL.createObjectURL(blob);
        capturedImage.src = capturedUrl;
        captureHint.innerHTML = '※シャカちゃんと写真撮影しました。<br>「写真に保存」をタップして<br>スマートフォンに保存してください。';
        captureView.hidden = false;
      }, 'image/jpeg', 0.95);
    });

    closeCapture.addEventListener('click', () => {
      captureView.hidden = true;
    });

    shareCapture.addEventListener('click', async () => {
      if (!capturedBlob) return;
      const now = new Date();
      const date = [now.getFullYear(), String(now.getMonth() + 1).padStart(2, '0'), String(now.getDate()).padStart(2, '0')].join('');
      const time = [now.getHours(), now.getMinutes(), now.getSeconds()].map(x => String(x).padStart(2, '0')).join('');
      const file = new File([capturedBlob], `shakachan_${date}_${time}.jpg`, { type: 'image/jpeg' });

      try {
        if (navigator.share && (!navigator.canShare || navigator.canShare({ files: [file] }))) {
          await navigator.share({ files: [file], title: 'シャカちゃんとの記念写真' });
        } else {
          captureHint.textContent = '画像を長押しして「写真に保存」を選んでください。';
        }
      } catch (error) {
        if (error.name !== 'AbortError') {
          console.error(error);
          captureHint.textContent = '画像を長押しして「写真に保存」を選んでください。';
        }
      }
    });

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && stream && !cameraStage.hidden) video.play().catch(() => {});
    });

    window.addEventListener('beforeunload', stopCamera);
  </script>
</body>
</html>
